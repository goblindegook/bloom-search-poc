<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sites using Bloom Search.">
    <title>Showcase · Bloom Search</title>
    <link rel="stylesheet" href="/src/site.css">
  </head>
  <body>
    <!--include header showcase-->
    <div class="on-ink">
      <div class="wrap band-title">
        <h1>Showcase</h1>
      </div>
    </div>
    <main id="main" tabindex="-1" class="focus:outline-none">
      <div class="wrap py-[clamp(3rem,7vw,5.5rem)]">
        <ul class="grid gap-x-8 gap-y-14 sm:grid-cols-2 lg:grid-cols-3">
          <li>
            <!-- biome-ignore lint/a11y/useAnchorContent: repeats the title link below, so it is hidden from assistive tech -->
            <a
              href="https://fantasticmetropolis.com"
              tabindex="-1"
              aria-hidden="true"
              class="block border border-ink"
              ><img
                src="/showcase/fantastic-metropolis.jpg"
                alt=""
                width="1280"
                height="800"
                loading="eager"
                class="block h-auto w-full"
              ></a
            >
            <p class="label mt-4">Magazine</p>
            <h2
              class="mt-1 text-[clamp(1.25rem,2vw,1.5rem)] font-normal leading-tight tracking-[-0.02em] no-underline"
            >
              <a href="https://fantasticmetropolis.com">Fantastic Metropolis</a>
            </h2>
          </li>
          <li>
            <!-- biome-ignore lint/a11y/useAnchorContent: repeats the title link below, so it is hidden from assistive tech -->
            <a
              href="https://nowwetry.it"
              tabindex="-1"
              aria-hidden="true"
              class="block border border-ink"
              ><img
                src="/showcase/now-we-try-it-my-way.jpg"
                alt=""
                width="1280"
                height="800"
                loading="lazy"
                class="block h-auto w-full"
              ></a
            >
            <p class="label mt-4">Cookbook</p>
            <h2
              class="mt-1 text-[clamp(1.25rem,2vw,1.5rem)] font-normal leading-tight tracking-[-0.02em] no-underline"
            >
              <a href="https://nowwetry.it">Now We Try It My Way</a>
            </h2>
          </li>
          <li>
            <!-- biome-ignore lint/a11y/useAnchorContent: repeats the title link below, so it is hidden from assistive tech -->
            <a
              href="https://goblindegook.com"
              tabindex="-1"
              aria-hidden="true"
              class="block border border-ink"
              ><img
                src="/showcase/goblindegook.jpg"
                alt=""
                width="1280"
                height="800"
                loading="lazy"
                class="block h-auto w-full"
              ></a
            >
            <p class="label mt-4">Blog</p>
            <h2
              class="mt-1 text-[clamp(1.25rem,2vw,1.5rem)] font-normal leading-tight tracking-[-0.02em] no-underline"
            >
              <a href="https://goblindegook.com">goblindegook</a>
            </h2>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
